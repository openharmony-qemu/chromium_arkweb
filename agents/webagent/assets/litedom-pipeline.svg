<svg xmlns="http://www.w3.org/2000/svg" width="2240" height="984" viewBox="0 0 1120 492" role="img" aria-labelledby="title desc">
<title id="title">页面感知 · 从网页结构到操作目标</title>
<desc id="desc">提取必要的页面信息，帮助模型识别可交互元素。</desc>
<rect x="0" y="0" width="1120" height="492" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/>
<text x="40" y="44" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="32" font-weight="700" text-anchor="start" dominant-baseline="central" fill="#19334D">页面感知 · 从网页结构到操作目标</text>
<text x="40" y="84" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#60758B">提取必要的页面信息，帮助模型识别可交互元素。</text>
<rect x="40" y="142" width="280" height="252" rx="12" fill="#F5F7FA" stroke="#DCE5EF" stroke-width="2"/>
<text x="180" y="179" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#19334D">原始页面结构</text>
<rect x="420" y="142" width="280" height="252" rx="12" fill="#EDF4FF" stroke="#DCE5EF" stroke-width="2"/>
<text x="560" y="179" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#2563EB">提取与筛选</text>
<rect x="800" y="142" width="280" height="252" rx="12" fill="#F5F7FA" stroke="#DCE5EF" stroke-width="2"/>
<text x="940" y="179" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#19334D">供模型使用的元素列表</text>
<rect x="58" y="218" width="244" height="38" rx="12" fill="#FFFFFF" stroke="#DCE5EF" stroke-width="2"/>
<text x="180" y="237" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#60758B">页面内容与布局</text>
<rect x="58" y="269" width="244" height="38" rx="12" fill="#FFFFFF" stroke="#DCE5EF" stroke-width="2"/>
<text x="180" y="288" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#60758B">按钮、输入框等控件</text>
<rect x="58" y="320" width="244" height="38" rx="12" fill="#FFFFFF" stroke="#DCE5EF" stroke-width="2"/>
<text x="180" y="339" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#60758B">脚本、样式与隐藏节点</text>
<text x="560" y="235" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#2563EB">识别可交互元素</text>
<text x="560" y="287" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#2563EB">过滤不可见与冗余内容</text>
<text x="560" y="339" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#2563EB">保留文本、属性与位置</text>
<polyline points="324,268 414,268" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="414,268 403,263 403,273" fill="#2563EB"/>
<polyline points="704,268 794,268" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="794,268 783,263 783,273" fill="#2563EB"/>
<text x="940" y="218" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#60758B">LiteDOM + 元素编号</text>
<rect x="818" y="245" width="244" height="36" rx="12" fill="#FFFFFF" stroke="#DCE5EF" stroke-width="2"/>
<text x="831" y="263" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#19334D">[1] 输入框：搜索关键词</text>
<rect x="818" y="289" width="244" height="36" rx="12" fill="#FFFFFF" stroke="#DCE5EF" stroke-width="2"/>
<text x="831" y="307" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#19334D">[2] 按钮：搜索</text>
<rect x="818" y="333" width="244" height="36" rx="12" fill="#FFFFFF" stroke="#DCE5EF" stroke-width="2"/>
<text x="831" y="351" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#19334D">[3] 链接：查看详情</text>
<text x="560" y="449" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#60758B">WebAgent 整理页面描述并分配元素编号，模型据此选择操作目标。</text>
</svg>
