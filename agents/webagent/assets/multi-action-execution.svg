<svg xmlns="http://www.w3.org/2000/svg" width="2240" height="1320" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">多动作执行 · 一次决策，逐步校验</title>
<desc id="desc">保留有效的后续动作；目标失效时清空队列，重新观察与推理。</desc>
<rect x="0" y="0" width="1120" height="660" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/>
<text x="40" y="44" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="32" font-weight="700" text-anchor="start" dominant-baseline="central" fill="#19334D">多动作执行 · 一次决策，逐步校验</text>
<text x="40" y="84" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#60758B">保留有效的后续动作；目标失效时清空队列，重新观察与推理。</text>
<rect x="60" y="155" width="250" height="92" rx="12" fill="#EDF4FF" stroke="#A7C3FC" stroke-width="2"/>
<text x="185" y="185" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#2563EB">模型推理</text>
<text x="185" y="222" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#60758B">生成一个或多个动作</text>
<rect x="430" y="155" width="250" height="92" rx="12" fill="#ECF8F3" stroke="#A8D8C8" stroke-width="2"/>
<text x="555" y="185" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#13836E">待执行动作队列</text>
<text x="555" y="222" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#60758B">按执行顺序保存动作</text>
<rect x="800" y="155" width="250" height="92" rx="12" fill="#ECF8F3" stroke="#A8D8C8" stroke-width="2"/>
<text x="925" y="185" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#13836E">校验下一动作</text>
<text x="925" y="222" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#60758B">检查页面与目标元素</text>
<polyline points="310,201 424,201" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="424,201 413,196 413,206" fill="#2563EB"/>
<polyline points="680,201 794,201" fill="none" stroke="#13836E" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="794,201 783,196 783,206" fill="#13836E"/>
<polyline points="925,247 925,354" fill="none" stroke="#13836E" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="925,354 930,343 920,343" fill="#13836E"/>
<text x="971" y="301" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#13836E">有效</text>
<rect x="800" y="356" width="250" height="92" rx="12" fill="#ECF8F3" stroke="#A8D8C8" stroke-width="2"/>
<text x="925" y="386" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#13836E">执行该动作</text>
<text x="925" y="423" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#60758B">从队列取出并执行</text>
<rect x="430" y="356" width="250" height="92" rx="12" fill="#ECF8F3" stroke="#A8D8C8" stroke-width="2"/>
<text x="555" y="386" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#13836E">重新观察页面</text>
<text x="555" y="423" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#60758B">更新页面与元素状态</text>
<polyline points="800,402 686,402" fill="none" stroke="#13836E" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="686,402 697,407 697,397" fill="#13836E"/>
<polyline points="555,356 555,253" fill="none" stroke="#13836E" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="555,253 550,264 560,264" fill="#13836E"/>
<rect x="499" y="286" width="112" height="37" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/>
<text x="555" y="305" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#13836E">队列非空</text>
<polyline points="430,402 185,402 185,253" fill="none" stroke="#13836E" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="185,253 180,264 190,264" fill="#13836E"/>
<text x="304" y="377" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#13836E">队列为空</text>
<polyline points="1050,201 1090,201 1090,553 555,553 555,454" fill="none" stroke="#13836E" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="555,454 550,465 560,465" fill="#13836E"/>
<rect x="718" y="532" width="322" height="40" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/>
<text x="879" y="552" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#13836E">失效：清空待执行动作</text>
<rect x="60" y="604" width="18" height="18" rx="3" fill="#EDF4FF" stroke="#A7C3FC" stroke-width="2"/>
<text x="90" y="613" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#60758B">模型参与</text>
<rect x="250" y="604" width="18" height="18" rx="3" fill="#ECF8F3" stroke="#A8D8C8" stroke-width="2"/>
<text x="280" y="613" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#60758B">程序处理</text>
</svg>
